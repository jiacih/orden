<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上點餐系統</title>
    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            border-bottom: 2px solid #ee6c4d;
            padding-bottom: 8px;
            color: #2b2d42;
        }
        .flavor-section {
            background-color: #fff3ed;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid #ffcad4;
        }
        .flavor-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .flavor-item {
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .menu-item {
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }
        .menu-item.market-price {
            border-color: #3d5a80;
            background-color: #e0f4ff;
        }
        .item-name {
            font-weight: bold;
        }
        .item-price {
            color: #d90429;
            font-weight: bold;
        }
        .market-price-tag {
            color: #293241;
            background: #98c1d9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 口味調整 (完整顯示 9 個選項) -->
    <div class="flavor-section">
        <h2>口味調整選項（全顯）</h2>
        <div class="flavor-options">
            <label class="flavor-item"><input type="radio" name="flavor" value="正常" checked> 正常</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="少鹽"> 少鹽</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="無鹽"> 無鹽</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="少油"> 少油</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="去油"> 去油</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="加辣"> 加辣</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="微辣"> 微辣</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="不辣"> 不辣</label>
            <label class="flavor-item"><input type="radio" name="flavor" value="素食"> 素食</label>
        </div>
    </div>

    <!-- 品項列表 (共 96 項) -->
    <h2>菜單品項 (共 96 項)</h2>
    <div class="menu-grid" id="menuContainer">
        <!-- 特殊品項：季節蔬菜顯示時價 -->
        <div class="menu-item market-price">
            <span class="item-name">季節蔬菜</span>
            <span class="market-price-tag">時價</span>
        </div>

        <!-- JS 動態生成其餘 95 個標準品項 -->
    </div>
</div>

<script>
    // 自動生成其餘 95 個範例品項 (總計 96 項)
    const menuContainer = document.getElementById('menuContainer');
    
    for (let i = 1; i <= 95; i++) {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'menu-item';
        
        // 範例金額，可替換為實際菜單資料
        const price = 50 + (i * 5); 
        
        itemDiv.innerHTML = `
            <span class="item-name">餐點品項 ${i}</span>
            <span class="item-price">$${price}</span>
        `;
        menuContainer.appendChild(itemDiv);
    }
</script>

</body>
</html>
