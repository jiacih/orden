<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呷百二滷味店 - POS系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f4f9; }

    /* 密碼鎖畫面 */
    #lock-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; }
    #lock-screen input { font-size: 24px; padding: 10px; text-align: center; width: 200px; margin: 15px 0; border-radius: 8px; border: none; }
    #lock-screen button { font-size: 20px; padding: 10px 30px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* 頂部導覽列 */
    .nav-bar { display: flex; background: #333; color: white; }
    .nav-btn { flex: 1; padding: 15px; text-align: center; font-size: 18px; cursor: pointer; border: none; background: transparent; color: white; font-weight: bold; }
    .nav-btn.active { background: #e74c3c; }

    .page { display: none; padding: 15px; }
    .page.active { display: block; }

    /* 櫃台點餐頁面 */
    .pos-container { display: flex; gap: 15px; }
    .menu-section { flex: 2; }
    .cart-section { flex: 1; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 15px; height: calc(100vh - 100px); overflow-y: auto; }

    .category-title { font-size: 20px; font-weight: bold; margin: 15px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid #ddd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    
    .item-btn { padding: 12px 5px; font-size: 16px; font-weight: bold; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; text-align: center; word-break: break-all; white-space: pre-line; min-height: 60px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; }
    .item-btn.meat { background-color: #ffdddd; border-color: #ff9999; color: #990000; }
    .item-btn.veg { background-color: #ddffdd; border-color: #99ff99; color: #006600; }

    .cart-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .cart-table th, .cart-table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; }
    .cart-total { font-size: 22px; font-weight: bold; color: #e74c3c; margin: 15px 0; text-align: right; }
    .pack-fee { color: #e67e22; font-size: 14px; font-weight: normal; }
    .submit-btn { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }

    /* 廚房顯示頁面 */
    .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .kds-card { background: white; border-radius: 8px; border-top: 6px solid #3498db; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .kds-card.urgent { border-top-color: #e74c3c; }
    .kds-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .kds-item { font-size: 18px; font-weight: bold; margin: 5px 0; white-space: pre-line; }
    .kds-container-tag { display: inline-block; padding: 3px 8px; background: #eee; border-radius: 4px; font-size: 14px; margin-top: 5px; }
    .complete-btn { width: 100%; margin-top: 15px; padding: 10px; background: #34495e; color: white; border: none; font-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* 統計頁面 */
    .stat-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- 密碼鎖控制頁 -->
  <div id="lock-screen">
    <h2>呷百二 POS 系統</h2>
    <input type="password" id="pass-input" placeholder="請輸入密碼">
    <button onclick="checkPass()">登入</button>
  </div>

  <!-- 導覽列 -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchPage('pos')">📱 櫃台點餐</button>
    <button class="nav-btn" onclick="switchPage('kds')">🖥️ 廚房顯示</button>
    <button class="nav-btn" onclick="switchPage('stats')">📊 銷售統計</button>
  </div>

  <!-- 頁面 1：櫃台點餐 -->
  <div id="page-pos" class="page active">
    <div class="pos-container">
      <div class="menu-section" id="menu-container"></div>
      <div class="cart-section">
        <h3>目前點餐明細</h3>
        <table class="cart-table">
          <thead>
            <tr><th>品項</th><th>數量</th><th>小計</th><th></th></tr>
          </thead>
          <tbody id="cart-items"></tbody>
        </table>
        <div class="cart-total">
          <div id="pack-fee-text" class="pack-fee"></div>
          總金額: $<span id="total-amount">0</span>
        </div>
        <button class="submit-btn" onclick="submitOrder()">送出訂單</button>
      </div>
    </div>
  </div>

  <!-- 頁面 2：廚房顯示 (KDS) -->
  <div id="page-kds" class="page">
    <div class="kds-grid" id="kds-container"></div>
  </div>

  <!-- 頁面 3：銷售統計 -->
  <div id="page-stats" class="page">
    <div class="stat-card">
      <h3>今日營業摘要</h3>
      <p>總訂單數：<strong id="stat-count">0</strong> 筆</p>
      <p>總營業額：$<strong id="stat-revenue">0</strong> 元</p>
    </div>
  </div>

  <!-- 導入 Firebase SDK (版本 10.x) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 您的 Firebase 認證金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyDk-WPutNSdzZzPktNnOR1s7OuOSEi5caA",
      authDomain: "orden-pos.firebaseapp.com",
      databaseURL: "https://orden-pos-default-rtdb.firebaseio.com",
      projectId: "orden-pos",
      storageBucket: "orden-pos.firebasestorage.app",
      messagingSenderId: "1037991430701",
      appId: "1:1037991430701:web:5ae2b89c461047f12e86a4",
      measurementId: "G-GT7YTFEJD8"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ordersRef = ref(db, 'orders');

    // 菜單資料
    const menuData = [
      { category: "肉類", type: "meat", items: [ { name: "豬肉片", price: 35 }, { name: "牛肉片", price: 40 }, { name: "雞胸肉", price: 35 } ] },
      { category: "蔬菜類", type: "veg", items: [ { name: "高麗菜", price: 25 }, { name: "空心菜", price: 25 }, { name: "金針菇", price: 20 } ] },
      { category: "火鍋料 / 特殊", type: "normal", items: [ { name: "麻糬燒\n(口味)", price: 20 }, { name: "甜不辣", price: 15 }, { name: "豆包", price: 15 } ] }
    ];

    let cart = [];

    // 密碼檢查
    window.checkPass = function() {
      const pass = document.getElementById('pass-input').value;
      if (pass === '1234') {
        document.getElementById('lock-screen').style.display = 'none';
      } else {
        alert('密碼錯誤！');
      }
    };

    // 頁面切換
    window.switchPage = function(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      event.target.classList.add('active');
    };

    // 渲染菜單
    function initMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      menuData.forEach(cat => {
        const title = document.createElement('div');
        title.className = 'category-title';
        title.innerText = cat.category;
        container.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';
        cat.items.forEach(item => {
          const btn = document.createElement('button');
          btn.className = `item-btn ${cat.type}`;
          btn.innerText = `${item.name}\n$${item.price}`;
          btn.onclick = () => addToCart(item);
          grid.appendChild(btn);
        });
        container.appendChild(grid);
      });
    }

    // 加入購物車
    function addToCart(item) {
      const existing = cart.find(c => c.name === item.name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      renderCart();
    }

    // 渲染購物車與費用計算
    function renderCart() {
      const tbody = document.getElementById('cart-items');
      tbody.innerHTML = '';
      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;
        tbody.innerHTML += `
          <tr>
            <td>${item.name.replace('\n', ' ')}</td>
            <td>
              <button onclick="changeQty(${index}, -1)">-</button>
              ${item.qty}
              <button onclick="changeQty(${index}, 1)">+</button>
            </td>
            <td>$${itemTotal}</td>
            <td><button onclick="removeItem(${index})">✕</button></td>
          </tr>
        `;
      });

      // 包裝費邏輯：未滿 $50 加收 $2
      let packFee = (subtotal > 0 && subtotal < 50) ? 2 : 0;
      let total = subtotal + packFee;

      document.getElementById('pack-fee-text').innerText = packFee > 0 ? "（未滿 $50，含包裝費 $2）" : "";
      document.getElementById('total-amount').innerText = total;
    }

    window.changeQty = function(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    };

    window.removeItem = function(index) {
      cart.splice(index, 1);
      renderCart();
    };

    // 送出訂單至 Firebase 雲端
    window.submitOrder = function() {
      if (cart.length === 0) return alert('請先選擇餐點！');

      let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      let packFee = (subtotal < 50) ? 2 : 0;
      let total = subtotal + packFee;
      // 容器規則：滿 $60 使用紙碗，否則使用塑膠袋
      let containerType = (total >= 60) ? "紙碗" : "塑膠袋";

      const orderData = {
        items: cart,
        total: total,
        container: containerType,
        status: "pending",
        timestamp: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      };

      // 寫入 Firebase
      push(ordersRef, orderData).then(() => {
        alert('訂單已傳送到廚房！');
        cart = [];
        renderCart();
      }).catch(err => alert('送單失敗：' + err.message));
    };

    // 即時監聽 Firebase 資料庫（A 手機送單，B 手機自動同步更新）
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      const kdsContainer = document.getElementById('kds-container');
      kdsContainer.innerHTML = '';

      let totalRevenue = 0;
      let orderCount = 0;

      if (data) {
        Object.keys(data).forEach(key => {
          const order = data[key];
          totalRevenue += order.total;
          orderCount++;

          if (order.status === 'pending') {
            let itemsHtml = order.items.map(i => `<div class="kds-item">• ${i.name.replace('\n', ' ')} x ${i.qty}</div>`).join('');
            
            kdsContainer.innerHTML += `
              <div class="kds-card">
                <div class="kds-header">
                  <span>時間：${order.timestamp}</span>
                  <span>$${order.total}</span>
                </div>
                ${itemsHtml}
                <div class="kds-container-tag">包裝：${order.container}</div>
                <button class="complete-btn" onclick="completeOrder('${key}')">出餐完成</button>
              </div>
            `;
          }
        });
      }

      // 更新統計
      document.getElementById('stat-count').innerText = orderCount;
      document.getElementById('stat-revenue').innerText = totalRevenue;
    });

    // 廚房點擊出餐完成
    window.completeOrder = function(orderId) {
      update(ref(db, `orders/${orderId}`), { status: 'completed' });
    };

    initMenu();
  </script>
</body>
</html>
